summary: >-
  Senior Full-Stack Engineer, 15 years, primarily Python and TypeScript, with systems and native application
  work in C, C++, Qt, and Swift on iOS. I specialise in taking existing codebases from fragile to
  maintainable: type coverage, test coverage, shared internal packages, and CI/CD that enforces both.
  Maintainer of 84 active open-source projects with over 300 merged upstream contributions.
experience:
  - company: The Walt Disney Company
    role: Senior Software Engineer
    dates: Sept 2023 to Present
    stack: >-
      Python, Django, React, Next.js, TypeScript, Snowflake, PostgreSQL, Redis, Docker, AWS Lambda/S3,
      GitLab CI/CD, Datadog
    bullets:
      - text: >-
          Principal engineer on the linear and digital audience forecasting platforms that project episode-level
          viewership across Disney's media networks, which drives advertising inventory decisions. Authored
          roughly 2,100 of 8,300 commits on the core service.
      - text: >-
          Drove AI-assisted development: authored the agent instruction and skill files that ship with
          the project template, so every repository inherits them, and built MCP servers exposing internal
          tooling to coding agents. Worked daily using Claude Opus.
      - text: >-
          Led the migration of the forecasting data layer from PostgreSQL to Snowflake: key-pair authentication,
          an identifier-casing migration behind a backwards-compatible view layer for existing consumers,
          and a move off a forked database driver onto the official upstream one.
      - text: >-
          Designed and shipped roughly a dozen reusable internal Python packages on a private index: OIDC/SSO
          auth, AWS Parameter Store configuration, middleware, health checks, Snowflake schema models,
          and PEP 561 stubs. All fully typed, and they drove an audit that pushed infrastructure code
          out of eight applications into shared libraries.
      - text: >-
          Built a package that deploys containerised Django and Next.js applications to AWS Lambda, turning
          a bespoke per-project deployment into a dependency plus a CI job.
        extra: true
      - text: >-
          Rebuilt the test strategy across services: replaced database-dependent tests with zero-database
          integration tests, raised backend coverage from 51% to above 90% with enforced thresholds, and
          reached 100% on several services. Migrated the frontend from Create React App to Vite and Vitest,
          added the first frontend test suite at 92% line coverage, and moved it to TypeScript strict
          mode.
        extra: true
      - text: >-
          Owned CI/CD and tooling standards: consolidated projects onto shared GitLab CI templates, wrote
          the code-quality report generators that surface Python formatter and linter output natively
          in merge requests, and created the project template system that keeps every repository current
          on dependencies, linting, typing, and testing configuration from a single update.
        extra: true
      - text: >-
          Integrated Datadog APM tracing and RUM across the web applications, migrated caching to managed
          Redis (ElastiCache cluster mode), and served as the go-to person for deployment, CI/CD, and
          Python debugging across teams, mentoring junior developers.
        extra: true
  - company: RingCentral
    role: Senior Software Engineer
    dates: May 2020 to Aug 2023
    stack: TypeScript, JavaScript, Node, React, PostgreSQL, AWS S3/RDS/CloudFront, GitLab CI
    bullets:
      - text: >-
          Owned the company's Zapier integration end to end (over 540 commits), exposing telephony, messaging,
          and meeting APIs to non-developers. Converted polling triggers such as call-ended and new-voicemail
          into webhook-driven instant triggers, cutting latency and API load.
      - text: >-
          Built the integration's TypeScript functional-testing framework and the CI/CD around it: suites
          triggered on private builds, coverage reported to GitLab Pages and InfluxDB, and automated release
          promotion. Instrumented the product with Mixpanel and Segment analytics, and fixed OAuth token
          lifetimes that were silently expiring connections.
      - text: >-
          Contributed to a new Microsoft Teams integration (automatic app installation into Teams, user
          account linking) and to a React presence-synchronisation frontend. Maintained the Zendesk integration
          for making and tracking calls from support tickets.
        extra: true
  - company: Blend360
    role: Senior Software Engineer Consultant
    dates: Nov 2022 to May 2023
    stack: >-
      TypeScript, React, Next.js, Flask, PostgreSQL, PyTorch, CUDA, Docker, nginx, uWSGI, AWS CDK/Lambda
    bullets:
      - text: >-
          Sole primary engineer on a full-stack marketing campaign-measurement application (372 of 392
          commits): React and TypeScript frontend, Flask REST API, PostgreSQL schema, and the analyst-facing
          interface for three causal-inference report types covering synthetic-control comparisons, covariate
          balance, and per-region weights.
      - text: >-
          Built the GPU inference service behind it (Flask, uWSGI, PyTorch, HuggingFace Transformers on
          an NVIDIA DGX system): one model pipeline per detected CUDA device, requests routed to the first
          free device, HTTP 503 when all were saturated. Diagnosed CUDA failing to initialise under uWSGI's
          pre-fork worker model and fixed it by deferring model loading into a post-fork hook.
      - text: >-
          Designed that application's report-request pipeline: JSON-Schema-validated intake, a single
          transaction writing the request and its parameters, dispatch to an external modelling service,
          and rollback on either a database error or a failed dispatch, so a failed run never left orphaned
          rows behind.
        extra: true
      - text: >-
          Shipped features to a Next.js news-analytics product on AWS Lambda@Edge, and wrote a standalone
          AWS CDK application that codified a hand-built account as infrastructure as code (VPC, public
          and private subnets across four availability zones, NAT gateways, route tables, DynamoDB), correcting
          a routing defect in which the NAT gateways sat on private subnets.
        extra: true
  - company: The Walt Disney Company
    role: Senior Software Engineer
    dates: July 2019 to April 2020
    bullets:
      - text: >-
          Delivered the ground-up overhaul of the same forecasting platform, over 1,500 commits. Wrote
          nearly all of the test suite, taking coverage from a low baseline to above 95% across frontend
          and backend, and completed the backend type annotations to make static analysis viable.
      - text: >-
          Architected the reporting application, added the GitLab CI hooks for QA and coverage reporting,
          and managed the nginx configuration used to host the site.
        extra: true
    note: >-
      This contract ended because of cutbacks due to the Coronavirus pandemic. I was invited back in
      2023.
    note_extra: true
  - company: Critical Mix
    role: Senior Software Engineer
    dates: Aug 2018 to April 2019
    stack: Python, asyncio, Oracle, AWS Lambda, mypy, pytest
    bullets:
      - text: >-
          Built an asyncio Python service synchronising survey panelist records between an Oracle data
          warehouse and a third-party sample-exchange API, deployed to AWS Lambda, fully type-annotated
          and tested.
