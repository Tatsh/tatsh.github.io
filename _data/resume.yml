open_source:
  intro: >-
    <a href="https://github.com/Tatsh" rel="noopener" target="_blank">github.com/Tatsh</a>: 84 active
    projects and 314 merged pull requests upstream, including 137 to MacPorts and stub improvements
    to Python typeshed and django-stubs.
  projects:
    - text: >-
        <a class="proj-name" href="https://github.com/Tatsh/wiswa" rel="noopener" target="_blank">Wiswa</a>
        (Python): generates and <em>maintains</em> projects from Jsonnet manifests, so one settings
        change re-renders CI config, linting, docs, and packaging across every project using it. In
        use at Disney and across nearly all of my own open-source projects.
    - text: >-
        <a class="proj-name" href="https://github.com/Tatsh/youtube-unofficial" rel="noopener" target="_blank">youtube-unofficial</a>
        (Python, ⭐ 56): maintained continuously since 2016, fully typed, with thirteen CI workflows
        publishing to PyPI, AppImage, Flatpak, and Snap.
    - text: >-
        <a class="proj-name" href="https://github.com/Tatsh/macprefs" rel="noopener" target="_blank">macprefs</a>
        (Python, ⭐ 43): exports and restores macOS preferences as version-controllable files.
    - text: >-
        <a class="proj-name" href="https://github.com/Tatsh/dbeaver-creds" rel="noopener" target="_blank">dbeaver-creds</a>
        (C, ⭐ 33): recovers saved DBeaver database credentials. One AES-128-CBC entry point behind a
        configure-time backend abstraction with three implementations (OpenSSL EVP, Windows CNG BCrypt,
        Apple CommonCrypto), tested with cmocka via <code>--wrap</code> symbol interposition, and <a
        href="https://pypi.org/project/dbeaver-creds/" rel="noopener" target="_blank">shipped as a CPython
        extension</a> in 48 wheels across eight platform tags.
    - text: >-
        <a class="proj-name" href="https://github.com/Tatsh/bpmdetect" rel="noopener" target="_blank">bpmdetect</a>
        (C++, ⭐ 14): automatic beats-per-minute detection for audio files.
