<div
  class="toolbar d-print-none d-flex flex-wrap justify-content-end"
  role="toolbar"
  aria-label="Display options"
>
  <!-- Below the md breakpoint the grid stacks anyway, so this control
       would do nothing. -->
  <button
    id="layout-toggle"
    type="button"
    class="btn btn-sm btn-outline-secondary d-none d-md-inline-block"
    aria-pressed="true"
  >
    <i id="layout-icon" class="fa-solid fa-align-left" aria-hidden="true"></i>
    <span class="visually-hidden" id="layout-toggle-label">Switch to single column</span>
  </button>
  <!-- The sheet is 8.5in (816px) wide, so expanding gains nothing until
       the viewport is comfortably past that. Hidden below lg: at iPad Air
       portrait width (820px) this would buy about 4px. -->
  <button
    id="width-toggle"
    type="button"
    class="btn btn-sm btn-outline-secondary d-none d-lg-inline-block"
    aria-pressed="false"
  >
    <i
      id="width-icon"
      class="fa-solid fa-up-right-and-down-left-from-center"
      aria-hidden="true"
    ></i>
    <span class="visually-hidden" id="width-toggle-label">Expand to full window width</span>
  </button>
  <span class="btn-group btn-group-sm" role="group" aria-label="Text size">
    <button id="font-down" type="button" class="btn btn-outline-secondary">
      <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
      <span class="visually-hidden">Decrease text size</span>
    </button>
    <button id="font-up" type="button" class="btn btn-outline-secondary">
      <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
      <span class="visually-hidden">Increase text size</span>
    </button>
  </span>
  <button id="theme-toggle" type="button" class="btn btn-sm btn-outline-secondary">
    <i id="theme-icon" class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
    <span class="visually-hidden" id="theme-label">Theme: follow the system</span>
  </button>
  <button id="help-btn" type="button" class="btn btn-sm btn-outline-secondary">
    <i class="fa-solid fa-question" aria-hidden="true"></i>
    <span class="visually-hidden">Keyboard shortcuts and gestures</span>
  </button>
  <button id="print-btn" type="button" class="btn btn-sm btn-primary">
    <i class="fa-solid fa-print" aria-hidden="true"></i>
    <span class="visually-hidden">Print or save as PDF</span>
  </button>
</div>
